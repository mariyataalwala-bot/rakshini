<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Operator OS HUD</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent !important;
    }
    #hud-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .vision-box {
      position: absolute;
      border: 1px dashed rgba(0, 255, 170, 0.4);
      background: rgba(0, 255, 170, 0.05);
      border-radius: 2px;
      pointer-events: none;
      box-sizing: border-box;
    }
    .vision-box::before {
      content: attr(data-id) " █ " attr(data-text);
      position: absolute;
      top: -16px;
      left: -1px;
      background: #00ffaa;
      color: #000;
      font-size: 8px;
      padding: 2px 4px;
      border-radius: 2px 2px 0 0;
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="hud-container"></div>
  <script>
    // Listen for elements from main process
    window.electronAPI.onUpdateHUD((data) => {
      const container = document.getElementById('hud-container');
      container.replaceChildren();
      
      let elements = data;
      let offset = { x: 0, y: 0 };
      if (data && !Array.isArray(data) && data.elements) {
          elements = data.elements;
          offset = data.offset || { x: 0, y: 0 };
      }
      
      if (!elements || !elements.forEach) return;
      
      const fragment = document.createDocumentFragment();
      elements.forEach(el => {
        if (!el.bounds || el.bounds.width <= 0 || el.bounds.height <= 0) return;
        const isInteractiveRole = [
          'AXLink', 'AXButton', 'AXDockItem', 'AXTextField', 
          'AXMenuBarItem', 'AXPopUpButton', 'AXRadioButton', 'AXCheckBox',
          'AXMenuItem', 'AXComboBox', 'AXTextArea', 'AXSearchField'
        ].includes(el.role);
        
        if (!el.is_interactive && !isInteractiveRole) {
          return;
        }
        const box = document.createElement('div');
        box.className = 'vision-box';
        // Subtract the window offset to map screen coordinates to window coordinates
        box.style.left = (el.bounds.x - offset.x) + 'px';
        box.style.top = (el.bounds.y - offset.y) + 'px';
        box.style.width = el.bounds.width + 'px';
        box.style.height = el.bounds.height + 'px';
        box.setAttribute('data-id', el.id || 'VIS');
        box.setAttribute('data-text', (el.text || '').substring(0, 20));
        fragment.appendChild(box);
      });
      container.appendChild(fragment);
    });
  </script>
</body>
</html>
