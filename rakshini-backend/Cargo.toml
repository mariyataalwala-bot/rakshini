[package]
name = "rakshini-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
image = "0.25"
chrono = { version = "0.4", features = ["serde"] }

# Stubs for heavy dependencies to allow compilation and execution without downloading gigabytes of models or C++ runtimes
# nokhwa = "0.10"
ort = { version = "2.0.0-rc.2", features = ["download-binaries", "ndarray"] }
reqwest = { version = "0.11", features = ["stream"] }
ndarray = "0.17"
bytes = "1.0"
# candle-core = "0.6"
# candle-nn = "0.6"
# candle-transformers = "0.6"
